name: Deploy React Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build React website
        run: npm run build

      - name: Create service page entry points
        run: |
          mkdir -p build/certificates
          mkdir -p build/services/reiki
          mkdir -p build/services/dowsing
          mkdir -p build/services/past-life-regression
          mkdir -p build/services/chakra-wellness
          mkdir -p build/services/spiritual-wellness
          mkdir -p build/services/meditation
          mkdir -p build/services/manifestation
          mkdir -p build/services/fingerprint-analysis

          cp build/index.html build/certificates/index.html
          cp build/index.html build/services/reiki/index.html
          cp build/index.html build/services/dowsing/index.html
          cp build/index.html build/services/past-life-regression/index.html
          cp build/index.html build/services/chakra-wellness/index.html
          cp build/index.html build/services/spiritual-wellness/index.html
          cp build/index.html build/services/meditation/index.html
          cp build/index.html build/services/manifestation/index.html
          cp build/index.html build/services/fingerprint-analysis/index.html

      - name: Verify service page entry points
        run: |
          test -f build/certificates/index.html
          test -f build/services/reiki/index.html
          test -f build/services/dowsing/index.html
          test -f build/services/past-life-regression/index.html
          test -f build/services/chakra-wellness/index.html
          test -f build/services/spiritual-wellness/index.html
          test -f build/services/meditation/index.html
          test -f build/services/manifestation/index.html
          test -f build/services/fingerprint-analysis/index.html

      - name: Create GitHub Pages fallback
        run: cp build/index.html build/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
